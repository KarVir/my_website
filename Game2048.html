<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>2048</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf8ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }

    h1 {
      margin: 20px 0 10px;
      color: #776e65;
    }

    #board {
      width: 400px;
      height: 400px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      background: #bbada0;
      padding: 10px;
      border-radius: 10px;
    }

    .tile {
      width: 100%;
      height: 100%;
      background: #cdc1b4;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 5px;
      color: #776e65;
    }

    .tile-2    { background: #eee4da; }
    .tile-4    { background: #ede0c8; }
    .tile-8    { background: #f2b179; color: #fff; }
    .tile-16   { background: #f59563; color: #fff; }
    .tile-32   { background: #f67c5f; color: #fff; }
    .tile-64   { background: #f65e3b; color: #fff; }
    .tile-128  { background: #edcf72; color: #fff; }
    .tile-256  { background: #edcc61; color: #fff; }
    .tile-512  { background: #edc850; color: #fff; }
    .tile-1024 { background: #edc53f; color: #fff; }
    .tile-2048 { background: #edc22e; color: #fff; }

    #game-over {
      margin-top: 20px;
      font-size: 24px;
      color: red;
    }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div id="board"></div>
  <div id="game-over"></div>

  <script>
    const size = 4;
    let board = Array.from({ length: size }, () => Array(size).fill(0));
    const boardEl = document.getElementById("board");
    const gameOverEl = document.getElementById("game-over");

    function init() {
      board = Array.from({ length: size }, () => Array(size).fill(0));
      addRandomTile();
      addRandomTile();
      drawBoard();
      gameOverEl.textContent = "";
    }

    function drawBoard() {
      boardEl.innerHTML = "";
      board.flat().forEach(val => {
        const tile = document.createElement("div");
        tile.className = `tile tile-${val || ""}`;
        tile.textContent = val || "";
        boardEl.appendChild(tile);
      });
    }

    function addRandomTile() {
      let empty = [];
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) empty.push([r, c]);
        }
      }
      if (empty.length === 0) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function move(dir) {
      let moved = false;
      let oldBoard = JSON.stringify(board);

      for (let i = 0; i < size; i++) {
        let line = [];
        for (let j = 0; j < size; j++) {
          let val = dir === "left" || dir === "right" ? board[i][j] : board[j][i];
          if (val !== 0) line.push(val);
        }

        if (dir === "right" || dir === "down") line.reverse();

        for (let j = 0; j < line.length - 1; j++) {
          if (line[j] === line[j + 1]) {
            line[j] *= 2;
            line[j + 1] = 0;
          }
        }

        line = line.filter(val => val !== 0);
        while (line.length < size) line.push(0);

        if (dir === "right" || dir === "down") line.reverse();

        for (let j = 0; j < size; j++) {
          if (dir === "left") board[i][j] = line[j];
          else if (dir === "right") board[i][j] = line[j];
          else if (dir === "up") board[j][i] = line[j];
          else if (dir === "down") board[j][i] = line[j];
        }
      }

      if (JSON.stringify(board) !== oldBoard) {
        addRandomTile();
        drawBoard();
        if (isGameOver()) gameOverEl.textContent = "💥 GAME OVER!";
      }
    }

    function isGameOver() {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) return false;
          if (c < size - 1 && board[r][c] === board[r][c + 1]) return false;
          if (r < size - 1 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") move("left");
      else if (e.key === "ArrowRight") move("right");
      else if (e.key === "ArrowUp") move("up");
      else if (e.key === "ArrowDown") move("down");
    });

    init();
  </script>
</body>
</html>
