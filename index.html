<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karolína Virágová</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        const subject = encodeURIComponent(
            "Kontakt z webu – " + name
        );

        const body = encodeURIComponent(
            "Jméno: " + name + "\n" +
            "E-mail: " + email + "\n\n" +
            "Zpráva:\n" +
            message
        );

        window.location.href =
            "mailto:karolinaviragova4@seznam.cz" +
            "?subject=" + subject +
            "&body=" + body;
    });
</script>
<body>

<div class="portfolio">

    <!-- PROFILE -->
    <section class="profile card">

        <div class="profile-left">

            <img
                src="assets/logo_KV.png"
                alt="Karolína Virágová"
                class="logo"
            >

            <div class="profile-info">

                <h1>Karolína Virágová</h1>

                <div class="badges">
                    <span>💻 Front-end Developer</span>
                    <span>⌖ Brno, Czech Republic</span>
                </div>

            </div>

        </div>

        <div class="socials">
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>

    </section>


    <!-- PROJECTS -->
    <section class="projects card">

        <h2>Projects</h2>

        <div class="project">
            <div class="project-image project-1">

                <span>KaroVir</span>
                <small>2025</small>

            </div>
        </div>


        <div class="project">
            <div class="project-image project-2">

                <span>Interactive visual editor for teaching webdesign</span>
                <small>2026</small>

            </div>
        </div>


        <div class="project">
            <div class="project-image project-3">

                <span>Man, don`t be angry</span>
                <small>2025</small>

            </div>
        </div>

    </section>


    <!-- BIO -->
    <section class="bio card">

        <h2>Bio</h2>

       


        <div class="bio-info">

            <div>
                <strong>Education</strong>
                <span>FIT VUT</span>
            </div>

            <div>
                <strong>Location</strong>
                <span>Brno, Czech Republic</span>
            </div>

        </div>

    </section>


    <!-- CONTACT -->
    <!-- CONTACT -->
<section class="contact card">

    <h2>Contact</h2>

  <form id="contact-form">

    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        name="name"
        placeholder="Your name"
        required
    >

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="example@mail.com"
        required
    >

    <label for="message">Your Message</label>

    <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required
    ></textarea>

    <button type="submit" id="send-button">
        Send Message
    </button>

    <p id="form-status"></p>

</form>

</section>


    <!-- FOOTER -->
    <footer>
        © 2026 Karolína Virágová
    </footer>

</div>

</body>
</html>
